<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Game</title>
<meta name="description" content="Game Boy player — bring your own ROM">
<meta name="theme-color" content="#111111">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/favicon.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta property="og:title" content="Game">
<meta property="og:description" content="Game Boy player — bring your own ROM">
<meta property="og:type" content="website">
<meta property="og:url" content="https://slevin48.github.io/game/">
<meta property="og:image" content="https://slevin48.github.io/game/icons/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<style>
  :root { --bg: #111; --fg: #eee; --muted: #999; --accent: #e3350d; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); font-family: system-ui, sans-serif; }
  #picker { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; padding: 16px; text-align: center; }
  #picker h1 { margin: 0; font-size: 28px; }
  #picker p { margin: 0; color: var(--muted); max-width: 420px; line-height: 1.5; }
  .btn { background: var(--accent); color: #fff; padding: 12px 24px; border: none; border-radius: 8px; cursor: pointer; font: 600 16px system-ui, sans-serif; }
  .link { background: none; padding: 4px; color: var(--muted); font-weight: 400; font-size: 14px; text-decoration: underline; }
  #play { display: none; }
  input[type=file] { display: none; }
  #stage { width: 100%; height: 100%; display: none; }
</style>
</head>
<body>
<div id="picker">
  <h1>Game</h1>
  <p id="hint">Load your own Game Boy ROM (<code>.gb</code> / <code>.gbc</code>). It stays in your browser — nothing is uploaded.</p>
  <button id="play" class="btn"></button>
  <label id="choose" class="btn">Choose ROM<input id="file" type="file" accept=".gb,.gbc"></label>
</div>
<div id="stage"><div id="game"></div></div>

<script>
const DB = 'poke', STORE = 'rom';

function db() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(DB, 1);
    req.onupgradeneeded = () => req.result.createObjectStore(STORE);
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}
async function saveRom(file) {
  const d = await db();
  d.transaction(STORE, 'readwrite').objectStore(STORE).put(file, 'last');
}
async function loadRom() {
  const d = await db();
  return new Promise(resolve => {
    const req = d.transaction(STORE).objectStore(STORE).get('last');
    req.onsuccess = () => resolve(req.result || null);
    req.onerror = () => resolve(null);
  });
}

function start(file) {
  document.getElementById('picker').style.display = 'none';
  document.getElementById('stage').style.display = 'block';
  window.EJS_player = '#game';
  window.EJS_core = 'gb';
  window.EJS_gameName = file.name.replace(/\.[^.]+$/, '');
  window.EJS_gameUrl = file;
  window.EJS_pathtodata = 'https://cdn.emulatorjs.org/stable/data/';
  window.EJS_startOnLoaded = true;
  const s = document.createElement('script');
  s.src = EJS_pathtodata + 'loader.js';
  document.body.appendChild(s);
}

document.getElementById('file').addEventListener('change', async e => {
  const file = e.target.files[0];
  if (!file) return;
  try { await saveRom(file); } catch {}
  start(file);
});
// Browsers block audio until the user taps, which stalls the emulator, so a saved ROM waits for a Play tap.
loadRom().then(f => {
  if (!f) return;
  const play = document.getElementById('play');
  play.textContent = '▶ Play ' + f.name.replace(/\.[^.]+$/, '');
  play.style.display = 'block';
  play.addEventListener('click', () => start(f));
  document.getElementById('hint').style.display = 'none';
  const choose = document.getElementById('choose');
  choose.classList.add('link');
  choose.firstChild.textContent = 'Choose another ROM';
}).catch(() => {});
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
</html>
